[project]
name = "trmcp"
version = "0.1.0"
description = "MCP server that feeds a TrainerRoad training plan (via the official calendar export feed) into Claude"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "icalendar>=6.1.0",
    "recurring-ical-events>=3.4.0",
    "httpx>=0.27.0",
]

[project.scripts]
trmcp = "trmcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trmcp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
